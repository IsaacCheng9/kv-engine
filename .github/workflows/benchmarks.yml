name: Benchmarks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install GCC 14, gRPC, and Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc

      - name: Configure CMake (release + benchmarks)
        run: cmake -B build_bench -DBENCHMARK=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build benchmark binary
        run: cmake --build build_bench --target kv_engine_benchmark

      - name: Run benchmarks
        run: |
          set -e
          echo "Commit: ${{ github.sha }}" | tee benchmark_results.txt
          echo "Date: $(date -u)" | tee -a benchmark_results.txt
          echo "" | tee -a benchmark_results.txt
          ./build_bench/kv_engine_benchmark | tee -a benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.txt
          retention-days: 90
